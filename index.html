      content="Edición cinematográfica de alto impacto."
    />

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"

      rel="stylesheet"

    <style>
      :root {
        --color-fondo-oscuro: #0f172a;
        --color-fondo-tarjeta: #1e293b;
        --color-cian: #22d3ee;
        --color-lavanda: #818cf8;
        --color-rosa: #f472b6;
        --texto-principal: #f8fafc;
        --texto-secundario: #94a3b8;
        --degradado-marca: linear-gradient(
          135deg,
          var(--color-cian) 0%,
          var(--color-lavanda) 50%,
          var(--color-rosa) 100%
        );
        --brand-whatsapp: #25d366;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: var(--color-fondo-oscuro);
        color: var(--texto-principal);
        line-height: 1.6;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      /* MENU */
      .menu-principal {
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
        backdrop-filter: blur(12px);
        background: rgba(15, 23, 42, 0.8);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .contenedor-navegacion {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.2rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo-marca {
        font-family: "Outfit", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        background: var(--degradado-marca);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-decoration: none;
      }
      .lista-enlaces {
        display: flex;
        list-style: none;
        gap: 2rem;
      }
      .lista-enlaces a {
        color: var(--texto-secundario);
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
      }
      .lista-enlaces a:hover {
        color: var(--color-cian);
      }

      /* HERO */
      .hero-bienvenida {
        position: relative;
        height: 100vh;
        width: 100%;
        overflow: hidden;
        clip-path: inset(0 0 0 0);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .contenedor-video-fixed {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }
      .video-fondo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.45;
      }
      .hero-bloque-texto {
        z-index: 2;
        padding: 0 20px;
      }
      .hero-bloque-texto h1 {
        font-size: clamp(3rem, 10vw, 5.5rem);
        font-family: "Outfit";
        line-height: 1;
        margin-bottom: 1.5rem;
        font-weight: 800;
      }
      .boton-llamada-accion {
        padding: 1.1rem 2.8rem;
        border-radius: 50px;
        background: var(--degradado-marca);
        color: white;
        text-decoration: none;
        font-weight: 700;
        transition: 0.3s;
        display: inline-block;
        box-shadow: 0 10px 20px rgba(34, 211, 238, 0.2);
      }

      /* SECCIONES */
      .seccion-estandar {
        padding: 80px 0;
        position: relative;
        z-index: 1;
        background: var(--color-fondo-oscuro);
      }
      .titulo-seccion {
        font-family: "Outfit";
        font-size: 2.5rem;
        margin-bottom: 1rem;
        text-align: center;
      }
      .etiqueta-pequena {
        display: block;
        text-align: center;
        color: var(--color-cian);
        text-transform: uppercase;
        font-weight: 700;
        font-size: 0.8rem;
        letter-spacing: 2px;
        margin-bottom: 0.5rem;
      }

      /* MARQUESINA GALERÍA */
      .contenedor-marquesina {
        display: flex;
        flex-direction: column;
        gap: 30px;
        overflow: hidden;
        padding: 40px 0;
      }
      .marquesina-wrapper {
        display: flex;
        overflow: hidden;
        mask-image: linear-gradient(
          to right,
          transparent,
          black 15%,
          black 85%,
          transparent
        );
      }
      .marquesina-track {
        display: flex;
        gap: 20px;
        flex-shrink: 0;
        animation: scroll-izq 40s linear infinite;
      }
      .marquesina-wrapper.reverse .marquesina-track {
        animation: scroll-der 40s linear infinite;
      }
      .marquesina-wrapper:hover .marquesina-track {
        animation-play-state: paused;
      }
      .marquesina-item {
        width: 320px;
        height: 200px;
        flex-shrink: 0;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .marquesina-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.5s ease;
      }
      .marquesina-item:hover img {
        transform: scale(1.1);
      }

      @keyframes scroll-izq {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes scroll-der {
        from {
          transform: translateX(-50%);
        }
        to {
          transform: translateX(0);
        }
      }

      /* PROMOCIONES */
      .seccion-promociones {
        background: #0f172a;
        padding: 80px 0 140px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
      .contenedor-slider {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px;
      }
      .caja-video-slider {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 24px;
        overflow: hidden;
        border: 2px solid rgba(129, 140, 248, 0.2);
        background: #000;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      }
      .caja-video-slider video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .seccion-promociones .swiper-pagination {
        bottom: 3px !important;
      }
      .seccion-promociones .swiper-pagination-bullet {
        background: rgba(255, 255, 255, 0.2);
      }
      .seccion-promociones .swiper-pagination-bullet-active {
        background: var(--color-cian);
      }

      /* FOOTER */
      .whatsapp-flotante {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        background-color: var(--brand-whatsapp);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        z-index: 2000;
        box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        text-decoration: none;
      }
      .pie-pagina {
        text-align: center;
        padding: 80px 20px;
        background: #080d1a;
      }
      .barra-redes {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        margin: 2rem 0;
      }
      .icono-red {
        width: 50px;
        height: 50px;
        background: var(--color-fondo-tarjeta);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-decoration: none;
        transition: 0.3s;
      }
      .icono-red:hover {
        background: var(--color-cian);
        transform: translateY(-5px);
      }

      @media (max-width: 768px) {
        .lista-enlaces {
          display: none;
        }
        .marquesina-item {
          width: 220px;
          height: 150px;
        }
      }
    </style>
